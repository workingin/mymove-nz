<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link type="text/css" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    


    <link type="text/css" rel="stylesheet" href="password.min.css" />
    <script src="password.min.js"></script>
    <script type="text/javascript">
        jQuery(document).ready(function($) {
          // Showing the progress bar since the first moment.
          $('#password').password({
            animate: false
            // Check out the readme or directly jquery.password.js
            // for a detailed list of properties.
          });

          // Default behavior
          $('#default').password();

          // Linked to field input
          $('#linked').password({
            field: '#username',
            showPercent: true
          });

          // Custom events (enables button on certain score)
          // Check the readme for a detailed list of events
          $('#submit').attr('disabled', true);
          $('#events').password().on('password.score', function (e, score) {
            if (score > 70) {
              $('#submit').removeAttr('disabled');
            } else {
              $('#submit').attr('disabled', true);
            }
          });

        });
    </script>

    <style type="text/css">
      label {
        display: block;
      }
      input {
        width: 300px;
      }
      .container {
        margin-top: 30px;
      }
      @media (min-width: 600px) {
        #main {
          width: 60%;
        }
      }
      .emojione {
        width: 20px;
        height: 20px;
      }

      /* better progress bar styles for the bootstrap demo */
      .pass-strength-visible input.form-control,
      input.form-control:focus {
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
      }

      .pass-strength-visible .pass-graybar,
      .pass-strength-visible .pass-colorbar,
      .form-control:focus + .pass-wrapper .pass-graybar,
      .form-control:focus + .pass-wrapper .pass-colorbar {
        border-bottom-right-radius: 4px;
        border-bottom-left-radius: 4px;
      }
      .btn-success:focus, .btn-success:hover {
    background-color: #6c7;
    border-color: #6c7;
}
.btn:not(.btn-link) {
    position: relative;
    height: 50px;
    border-radius: 5px 0 0 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 28px;
    font-size: 18px;
    box-shadow: none !important;
    font-weight: 500;
    padding-left: 28px;
}
.btn-success:hover {
    color: #fff;
    background-color: #157347;
    border-color: #146c43;
}
.btn:hover {
    color: #212529;
}
a:hover {
    color: #0a58ca;
}
.btn-success {
    background-color: var(--bs-success);
    border-color: var(--bs-success);
}
.btn-success {
    color: #fff;
    background-color: #198754;
    border-color: #198754;
}
.btn {
    display: inline-block;
    font-weight: 400;
    line-height: 1.5;
    color: #212529;
    text-align: center;
    text-decoration: none;
    vertical-align: middle;
    cursor: pointer;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    background-color: transparent;
    border: 1px solid transparent;
        border-top-color: transparent;
        border-right-color: transparent;
        border-bottom-color: transparent;
        border-left-color: transparent;
    padding: .375rem .75rem;
        padding-left: 0.75rem;
    font-size: 1rem;
    border-radius: .25rem;
    transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
}
    </style>
</head>
<body>
    
                <div class="form-group">
                    <label for="events">
                        Password
                    </label>
                    <input id="events" type="password" class="form-control" />
                </div>
                <button id="submit" onclick="return false" class="btn btn-info">Send</button>
     
  
</body>
</html>
